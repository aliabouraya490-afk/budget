lor:var(--muted)}.section{margin-top:16px}.section h2,.card h2{font-size:16px;margin:0 0 13px}.two{display:grid;grid-template-columns:1.15fr 1fr;gap:13px}.barrow{display:grid;grid-template-columns:100px 1fr 110px;gap:9px;align-items:center;margin:13px 0;font-size:12px}.bar{height:9px;background:#1a3655;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right}th{color:#9eb8d7;background:#102a48;white-space:nowrap}tr:last-child td{border:0}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#183b5e;color:#bcdcff;font-size:11px}.good{background:#123e38;color:#71e0b6}.warn{background:#4b3820;color:#ffd08a}.bad{background:#4c2631;color:#ff9ba5}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.field{display:grid;gap:6px;margin-bottom:9px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#071a30;border:1px solid #294565;color:var(--txt);border-radius:9px;padding:11px;min-width:0}input:focus,select:focus{outline:2px solid #347fd0}.notice{padding:12px 14px;border:1px solid #355778;background:#102b49;border-radius:12px;color:#c6dcf7;font-size:12px;line-height:1.8}.mobilebar{display:none}.hide{display:none!important}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:14px 4px 24px}.colbar{flex:1;min-width:10px;background:linear-gradient(180deg,#39c4dc,#2875d5);border-radius:7px 7px 2px 2px;position:relative}.colbar span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.empty{padding:25px;text-align:center;color:var(--muted)}.tag{font-size:11px;color:var(--cyan)}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline input{max-width:180px}.dangertext{color:#ff9ba5}.success{color:#71e0b6}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}

<div class="app"><aside class="side"><div class="brand">ALI ABOURAYA<small>BUDGET MANAGER · FCFA</small></div><div class="nav" id="nav"></div><div class="sidefoot">إدارة مالية شخصية<br>نسخة 2.0 · حفظ محلي تلقائي</div></aside><main class="main"><div class="top"><div><div class="tag">PERSONAL FINANCE MANAGEMENT</div><h1 id="pageTitle">لوحة المتابعة</h1><div class="muted" id="today"></div></div><div class="actions"><button class="ghost" onclick="document.getElementById('importFile').click()">⬆ استيراد Excel / JSON</button><button class="ghost" onclick="backup()">نسخة احتياطية</button><button class="primary" onclick="show('entry')">＋ تسجيل حركة</button><input id="importFile" type="file" accept=".xlsx,.xls,.csv,.json" class="hide" onchange="importFile(event)"></div></div><div id="view"></div></main></div><div class="mobilebar" id="mobileNav"></div>
<script>
const INITIAL={"config":{"salary":850000,"extraIncome":80000,"month":"2026-11","savingsGoal":2000000,"savingsMonthly":500000},"categories":[{"name":"أكل","limit":300000},{"name":"فواتير أخرى","limit":25000},{"name":"ترفيه","limit":50000},{"name":"مواصلات","limit":50000},{"name":"صحة","limit":25000},{"name":"أخرى","limit":350000},{"name":"اشتراكات واتصالات","limit":100000}],"entries":[{"date":"2026-11-01","category":"أكل","amount":80000,"note":"مستورد من ملف Excel"},{"date":"2026-11-01","category":"مواصلات","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-01","category":"أخرى","amount":8500,"note":"مستورد من ملف Excel"},{"date":"2026-11-01","category":"اشتراكات واتصالات","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-02","category":"أكل","amount":15000,"note":"مستورد من ملف Excel"},{"date":"2026-11-02","category":"أخرى","amount":56500,"note":"مستورد من ملف Excel"},{"date":"2026-11-03","category":"أكل","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-03","category":"أخرى","amount":15000,"note":"مستورد من ملف Excel"},{"date":"2026-11-04","category":"أكل","amount":72000,"note":"مستورد من ملف Excel"},{"date":"2026-11-04","category":"أخرى","amount":210000,"note":"مستورد من ملف Excel"},{"date":"2026-11-05","category":"أكل","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-05","category":"أخرى","amount":25000,"note":"مستورد من ملف Excel"},{"date":"2026-11-05","category":"اشتراكات واتصالات","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-06","category":"أكل","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-06","category":"ترفيه","amount":10000,"note":"مستورد من ملف Excel"},{"date":"2026-11-06","category":"أخرى","amount":8000,"note":"مستورد من ملف Excel"},{"date":"2026-11-07","category":"أكل","amount":18000,"note":"مستورد من ملف Excel"},{"date":"2026-11-07","category":"ترفيه","amount":5000,"note":"مستورد من ملف Excel"},{"date":"2026-11-07","category":"أخرى","amount":8000,"note":"مستورد من ملف Excel"},{"date":"2026-11-08","category":"أكل","amount":15000,"note":"مستورد من ملف Excel"},{"date":"2026-11-08","category":"ترفيه","amount":5000,"note":"مستورد من ملف Excel"},{"date":"2026-11-08","category":"أخرى","amount":8000,"note":"مستورد من ملف Excel"},{"date":"2026-11-08","category":"اشتراكات واتصالات","amount":5000,"note":"مستورد من ملف Excel"}],"dailyIncome":[],"debtsOwed":[{"date":"2026-11-07","name":"ali  dayehk","amount":20000,"paid":0,"note":"سلفة"},{"date":"2026-11-07","name":"ali abouraya","amount":268000,"paid":0,"note":"سلفة"}],"repayments":[],"debtsMe":[{"name":"ali abouraya","amount":268000,"paid":0,"due":"2026-12-02","note":"non paye"}],"fixed":[{"name":"inetnet","category":"اشتراكات واتصالات","amount":60000,"dueDay":10,"paid":true}],"other":[{"date":"2026-11-04","type":"عائلة","amount":80000,"note":"akil"}],"business":[{"date":"2026-11-07","income":80000,"cost":0,"note":"mange"}],"savings":[],"months":[{"month":"2026-11","income":930000,"expense":624000,"savings":306000}],"sourceWorkbook":"ali abouraya budget.xlsx","sourceSheets":["لوحة المتابعة","التنبيهات","المساعدة","الميزانية","اليومي","الديون","الثوابت","تفصيل أخرى","عملي الخاص","الادخار","ديوني","الأسبوعي","الأشهر"]};
const money=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n)||0)+' FCFA';
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthNow=()=>today().slice(0,7);
const blank=()=>({config:{salary:0,extraIncome:0,month:monthNow(),savingsGoal:0,savingsMonthly:0},categories:[],entries:[],dailyIncome:[],debtsOwed:[],repayments:[],debtsMe:[],fixed:[],other:[],business:[],savings:[],months:[]});
let data;let page='dashboard';
function clone(x){return JSON.parse(JSON.stringify(x))}
function migrate(x){let b=blank(); if(!x||typeof x!=='object')return b; if(x.config){Object.assign(b.config,x.config);Object.keys(b).forEach(k=>{if(Array.isArray(b[k])&&Array.isArray(x[k]))b[k]=x[k]})}else{b.config={salary:x.salary||0,extraIncome:x.extraIncome||0,month:x.month||monthNow(),savingsGoal:x.savingsGoal||0,savingsMonthly:x.savingsMonthly||0};['categories','entries','debtsOwed','debtsMe','fixed','business','savings','other','months'].forEach(k=>{if(Array.isArray(x[k]))b[k]=x[k]});}return b}
async function load(){try{const raw=localStorage.getItem('aliBudgetV2');if(raw){data=migrate(JSON.parse(raw));return}}catch(e){}data=clone(INITIAL);await persist(false)}
async function persist(rerender=true){try{localStorage.setItem('aliBudgetV2',JSON.stringify(data));localStorage.setItem('aliBudgetSavedAt',new Date().toISOString())}catch(e){alert('مساحة التخزين ممتلئة. أنشئ نسخة احتياطية واحذف بيانات قديمة غير لازمة.')}if(rerender)render()}
const pgs=[['dashboard','▦','لوحة المتابعة'],['entry','＋','الحركات اليومية'],['budget','◫','الميزانية'],['debts','⇄','الديون'],['fixed','▤','المصاريف الثابتة'],['other','▧','تفصيل أخرى'],['business','◆','عملي الخاص'],['savings','◉','الادخار'],['weekly','▥','المتابعة الأسبوعية'],['months','▤','مقارنة الأشهر'],['alerts','⚑','التنبيهات'],['backup','⬇','النسخ والاستيراد']];
const allEntries=()=>[...(data.entries||[]),...(data.dailyIncome||[]).map(x=>({...x,category:x.category||'دخل العمل الثاني',type:'income'}))];
const inMonth=(d)=>String(d||'').slice(0,7)===data.config.month;
const expRows=()=>data.entries.filter(x=>inMonth(x.date));
const spent=()=>expRows().reduce((s,x)=>s+(+x.amount||0),0);
const extraMonth=()=>data.dailyIncome.filter(x=>inMonth(x.date)).reduce((s,x)=>s+(+x.amount||0),0);
const businessMonth=()=>data.business.filter(x=>inMonth(x.date)).reduce((s,x)=>s+(+x.income||0),0);
const income=()=> (+data.config.salary||0)+(+data.config.extraIncome||0)+extraMonth();
const owed=()=>Math.max(0,data.debtsOwed.reduce((s,x)=>s+(+x.amount||0),0)-data.repayments.reduce((s,x)=>s+(+x.amount||0),0));
const due=()=>data.debtsMe.reduce((s,x)=>s+Math.max(0,(+x.amount||0)-(+x.paid||0)),0);
const saveSum=()=>data.savings.reduce((s,x)=>s+(+x.amount||0),0);
const catSpent=name=>expRows().filter(x=>x.category===name).reduce((s,x)=>s+(+x.amount||0),0);
function nav(){document.getElementById('nav').innerHTML=pgs.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="show('${id}')">${ic}　${t}</button>`).join('');document.getElementById('mobileNav').innerHTML=pgs.slice(0,5).map(([id,ic,t])=>`<button onclick="show('${id}')">${ic}<br>${t}</button>`).join('')}
function show(p){page=p;render()};function metric(label,value,hint=''){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x??'—'}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">لا توجد بيانات مسجلة</td></tr>`}</tbody></table></div>`}
function field(label,id,type='text',value='',placeholder=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${String(value??'').replace(/"/g,'&quot;')}" placeholder="${placeholder}"></div>`}
function dashboard(){let inc=income(),out=spent(),balance=inc-out-due(),limits=data.categories.reduce((s,c)=>s+(+c.limit||0),0),alerts=data.categories.filter(c=>c.limit&&catSpent(c.name)>=c.limit*.8);let cat=data.categories.map(c=>({...c,spent:catSpent(c.name)}));let last=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return {day:String(d.getDate()),v:data.entries.filter(x=>x.date===key).reduce((s,x)=>s+(+x.amount||0),0)}});let max=Math.max(1,...last.map(x=>x.v));return `<div class="grid">${metric('إجمالي الدخل',money(inc),'الراتب والدخل الإضافي')}${metric('إجمالي المصروف',money(out),'المسجل خلال '+data.config.month)}${metric('الرصيد بعد المصروف والديون',money(balance),'حساب تقديري وفق السجلات الحالية')}${metric('ديون لك عند الآخرين',money(owed()),'مستحقات غير مسددة')}</div><div class="two section"><div class="card"><h2>المصروف حسب الفئة</h2>${cat.map(c=>`<div class="barrow"><span>${c.name}</span><div class="bar"><i style="width:${Math.min(100,c.limit?c.spent/c.limit*100:0)}%;background:${c.spent>=c.limit?'var(--red)':'linear-gradient(90deg,var(--blue),var(--cyan))'}"></i></div><span>${money(c.spent)}</span></div>`).join('')||'<div class="empty">أضف فئات من صفحة الميزانية</div>'}</div><div class="card"><h2>حركة المصروف خلال آخر 7 أيام</h2><div class="chart">${last.map(x=>`<div class="colbar" title="${money(x.v)}" style="height:${Math.max(3,x.v/max*100)}%"><span>${x.day}</span></div>`).join('')}</div><div class="notice">${alerts.length?`تنبيه: ${alerts.map(x=>x.name).join('، ')} اقتربت من سقفها أو تجاوزته.`:'لا توجد فئات وصلت إلى 80% من سقفها.'}</div></div></div><div class="section card"><h2>آخر الحركات</h2>${table(['التاريخ','الفئة','المبلغ','ملاحظة'],data.entries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(x=>[x.date,x.category,money(x.amount),x.note||'']))}</div><div class="section notice">البيانات المستوردة من ملف Excel: ${data.sourceSheets?.length||13} أوراق. الحفظ تلقائي على هذا الجهاز. استخدم النسخ الاحتياطي لنقل البيانات بأمان.</div>`}
function entry(){return `<div class="card"><h2>تسجيل حركة مالية</h2><div class="formgrid">${field('التاريخ','eDate','date',today())}<div class="field"><label>نوع الحركة</label><select id="eType" onchange="toggleEntryType()"><option value="expense">مصروف</option><option value="income">دخل إضافي</option></select></div><div class="field" id="catField"><label>الفئة</label><select id="eCat">${data.categories.map(c=>`<option>${c.name}</option>`).join('')}</select></div>${field('المبلغ (FCFA)','eAmount','number','','مثلاً 15000')}${field('ملاحظة','eNote','text','','اختياري')}</div><div class="formactions"><button class="primary" onclick="addEntry()">حفظ الحركة</button></div></div><div class="section card"><h2>سجل المصاريف</h2>${table(['التاريخ','الفئة','المبلغ','ملاحظة','إجراء'],data.entries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map((x,i)=>[x.date,x.category,money(x.amount),x.note||'',`<button class="danger" onclick="removeItem('entries',${data.entries.indexOf(x)})">حذف</button>`]))}</div><div class="section card"><h2>الدخل الإضافي اليومي</h2>${table(['التاريخ','المبلغ','ملاحظة','إجراء'],data.dailyIncome.map((x,i)=>[x.date,money(x.amount),x.note||'',`<button class="danger" onclick="removeItem('dailyIncome',${i})">حذف</button>`]))}</div>`}
function toggleEntryType(){document.getElementById('catField').classList.toggle('hide',v('eType')==='income')}
function budget(){return `<div class="card"><h2>إعدادات الميزانية</h2><div class="formgrid">${field('الراتب الشهري','salary','number',data.config.salary)}${field('الدخل الإضافي الشهري الثابت','extra','number',data.config.extraIncome)}${field('الشهر المتابَع','bMonth','month',data.config.month)}</div><button class="primary" onclick="saveBudget()">حفظ الإعدادات</button></div><div class="section card"><h2>الفئات والسقوف الشهرية</h2>${table(['الفئة','السقف','المصروف','المتبقي','الحالة'],data.categories.map(c=>{let x=catSpent(c.name),pct=c.limit?x/c.limit:0;return [c.name,money(c.limit),money(x),money(c.limit-x),`<span class="pill ${pct>=1?'bad':pct>=.8?'warn':'good'}">${pct>=1?'تجاوز':pct>=.8?'انتباه':'جيد'}</span>`]}))}<div class="formgrid" id="catEditor">${data.categories.map((c,i)=>`<div>${field('اسم الفئة','cn'+i,'text',c.name)}${field('السقف الشهري','cl'+i,'number',c.limit)}</div>`).join('')}</div><div class="formactions"><button class="primary" onclick="saveCats()">حفظ التعديلات</button><button onclick="addCategory()">＋ إضافة فئة</button></div><div class="notice section">إجمالي السقوف: ${money(data.categories.reduce((s,c)=>s+(+c.limit||0),0))} · المصروف الحالي: ${money(spent())}</div></div>`}
function debts(){return `<div class="two"><div class="card"><h2>ديون لك عند الآخرين</h2><p class="muted">المتبقي: ${money(owed())}</p>${field('اسم الشخص','oName')}${field('المبلغ الذي أقرضته','oAmount','number')}${field('تاريخ السلفة','oDate','date',today())}${field('ملاحظة','oNote')}<button class="primary" onclick="addOwed()">إضافة سلفة</button><div class="section">${table(['الشخص','التاريخ','المبلغ'],data.debtsOwed.map((x,i)=>[x.name,x.date||'—',money(x.amount)]))}</div><h3>تسجيل سداد لك</h3>${field('اسم الشخص','rName')}${field('المبلغ المسدد','rAmount','number')}${field('تاريخ السداد','rDate','date',today())}<button onclick="addRepayment()">تسجيل السداد</button></div><div class="card"><h2>ديون عليك للآخرين</h2><p class="muted">المتبقي: ${money(due())}</p>${field('اسم الدائن','mName')}${field('المبلغ','mAmount','number')}${field('المسدّد حتى الآن','mPaid','number','0')}${field('تاريخ الاستحقاق','mDue','date')}${field('ملاحظة','mNote')}<button class="primary" onclick="addDebtMe()">إضافة دين</button><div class="section">${table(['الدائن','الأصل','المسدّد','المتبقي','الاستحقاق'],data.debtsMe.map(x=>[x.name,money(x.amount),money(x.paid),money(x.amount-x.paid),x.due||'—']))}</div></div></div>`}
function fixed(){return `<div class="card"><h2>إضافة مصروف ثابت</h2><div class="formgrid">${field('اسم المصروف','fName')}${field('الفئة','fCat')}${field('المبلغ الشهري','fAmount','number')}${field('يوم الاستحقاق','fDay','number')}</div><button class="primary" onclick="addFixed()">إضافة</button></div><div class="section card"><h2>الالتزامات الشهرية</h2>${table(['البند','الفئة','المبلغ','يوم الاستحقاق','الحالة','تعديل الحالة'],data.fixed.map((x,i)=>[x.name,x.category,money(x.amount),x.dueDay,x.paid?'مدفوع':'غير مدفوع',`<button onclick="toggleFixed(${i})">تغيير الحالة</button>`]))}<div class="notice section">المصاريف الثابتة لا تُخصم تلقائياً من سجل اليومي لتجنب احتساب المصروف مرتين. سجّل الدفعة في الحركات عند دفعها.</div></div>`}
function other(){return `<div class="card"><h2>تفصيل فئة «أخرى»</h2><div class="formgrid">${field('التاريخ','xDate','date',today())}${field('النوع','xType')}${field('المبلغ','xAmount','number')}${field('ملاحظة','xNote')}</div><button class="primary" onclick="addOther()">حفظ التفصيل</button><div class="notice section">هذا التفصيل للتصنيف فقط ولا يضاف مرة ثانية إلى إجمالي المصروفات.</div></div><div class="section card"><h2>التفاصيل المسجلة</h2>${table(['التاريخ','النوع','المبلغ','ملاحظة'],data.other.map(x=>[x.date,x.type,money(x.amount),x.note||'']))}</div>`}
function business(){let inc=data.business.reduce((s,x)=>s+(+x.income||0),0),cost=data.business.reduce((s,x)=>s+(+x.cost||0),0);return `<div class="card"><h2>تسجيل عملية من العمل الخاص</h2><div class="formgrid">${field('التاريخ','wDate','date',today())}${field('الدخل / المبيعات','wIncome','number')}${field('التكلفة','wCost','number')}${field('ملاحظة','wNote')}</div><button class="primary" onclick="addBusiness()">حفظ العملية</button></div><div class="section grid">${metric('إجمالي المبيعات',money(inc))}${metric('إجمالي التكاليف',money(cost))}${metric('صافي الربح',money(inc-cost))}${metric('هامش الربح',Math.round(inc?((inc-cost)/inc*100):0)+'%')}</div><div class="section card">${table(['التاريخ','الدخل','التكلفة','الربح','ملاحظة'],data.business.map(x=>[x.date,money(x.income),money(x.cost),money(x.income-x.cost),x.note||'']))}</div>`}
function savings(){let s=saveSum(),goal=+data.config.savingsGoal||0;return `<div class="grid">${metric('هدف الادخار',money(goal))}${metric('المدخر حتى الآن',money(s))}${metric('المتبقي للهدف',money(Math.max(0,goal-s)))}${metric('نسبة الوصول',Math.round(goal?s/goal*100:0)+'%')}</div><div class="card section"><h2>إعداد هدف الادخار</h2><div class="formgrid">${field('الهدف الإجمالي','sGoal','number',goal)}${field('المبلغ الشهري المخطط','sMonthly','number',data.config.savingsMonthly)}</div><button class="primary" onclick="saveSavingsGoal()">حفظ الهدف</button></div><div class="card section"><h2>تسجيل مبلغ مدخر</h2><div class="formgrid">${field('التاريخ','sDate','date',today())}${field('المبلغ','sAmount','number')}${field('ملاحظة','sNote')}</div><button class="primary" onclick="addSaving()">إضافة الادخار</button><div class="section">${table(['التاريخ','المبلغ','ملاحظة'],data.savings.map(x=>[x.date,money(x.amount),x.note||'']))}</div></div>`}
function weekly(){let start=new Date(data.config.month+'-01'),weeks=[];for(let i=0;i<5;i++){let a=new Date(start);a.setDate(1+i*7);let b=new Date(a);b.setDate(a.getDate()+6);let last=new Date(a.getFullYear(),a.getMonth()+1,0);if(a>last)continue;if(b>last)b=last;let key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let totalx=data.entries.filter(x=>x.date>=key(a)&&x.date<=key(b)).reduce((s,x)=>s+(+x.amount||0),0);weeks.push([`الأسبوع ${i+1}`,key(a),key(b),money(totalx)])}return `<div class="card"><h2>المتابعة الأسبوعية · ${data.config.month}</h2>${table(['الفترة','من','إلى','المصروف'],weeks)}</div>`}
function months(){let m={};data.entries.forEach(x=>{let k=(x.date||'').slice(0,7);if(!k)return;m[k]=(m[k]||0)+(+x.amount||0)});Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));let rows=Object.keys(m).sort().map(k=>[k,money((+data.config.salary||0)+(+data.config.extraIncome||0)),money(m[k]),money((+data.config.salary||0)+(+data.config.extraIncome||0)-m[k])]);return `<div class="card"><h2>مقارنة الأشهر</h2>${table(['الشهر','الدخل الثابت','المصروف المسجل','الفائض التقديري'],rows)}<div class="notice section">المقارنة مبنية على الحركات اليومية المتاحة في الملف، ولا نضيف أشهرًا غير موجودة من تلقاء أنفسنا.</div></div>`}
function alerts(){let rows=data.categories.map(c=>{let x=catSpent(c.name),p=c.limit?x/c.limit:0;return [c.name,money(c.limit),money(x),Math.round(p*100)+'%',p>=1?'تجاوز السقف':p>=.8?'قريب من السقف':'ضمن الحدود']}).filter(r=>r[4]!=='ضمن الحدود');return `<div class="card"><h2>مركز التنبيهات</h2>${rows.length?table(['الفئة','السقف','المصروف','الاستهلاك','الحالة'],rows):'<div class="notice">لا توجد تنبيهات حالياً وفق حدود الميزانية.</div>'}</div>`}
function backupPage(){return `<div class="card"><h2>حماية بياناتك</h2><p class="muted">تُحفظ التغييرات تلقائياً على هذا الجهاز. احتفظ بنسخة JSON دورياً وانقلها إلى أجهزتك الأخرى يدوياً.</p><div class="formactions"><button class="primary" onclick="backup()">تنزيل نسخة احتياطية JSON</button><button onclick="document.getElementById('importFile').click()">استعادة JSON أو استيراد Excel</button><button onclick="exportExcel()">تصدير تقارير Excel</button><button onclick="window.print()">طباعة / PDF</button></div><div class="notice section">المزامنة السحابية بين الأجهزة غير مفعّلة في هذه النسخة. لا تضع الملف في مجلد عام أو جهاز مشترك. قبل الاستعادة، أنشئ نسخة احتياطية من بياناتك الحالية.</div><p class="muted">آخر حفظ محلي: <b id="savedAt">—</b></p><p class="muted">مصدر البيانات: ${data.sourceWorkbook||'بيانات التطبيق'} · أوراق المصدر: ${data.sourceSheets?.length||'—'}</p></div>`}
function v(id){return document.getElementById(id)?.value||''}function num(id){return Math.max(0,+v(id)||0)}
function addEntry(){let amount=num('eAmount');if(!amount||!v('eDate'))return alert('أدخل التاريخ والمبلغ الصحيح.');let row={date:v('eDate'),amount,note:v('eNote')};if(v('eType')==='income'){row.category='دخل العمل الثاني';data.dailyIncome.push(row)}else{row.category=v('eCat');data.entries.push(row)}persist()}
function saveBudget(){data.config.salary=num('salary');data.config.extraIncome=num('extra');data.config.month=v('bMonth');persist()}
function saveCats(){data.categories.forEach((c,i)=>{c.name=v('cn'+i).trim()||c.name;c.limit=num('cl'+i)});persist()}
function addCategory(){let name=prompt('اسم الفئة الجديدة؟');if(!name)return;if(data.categories.some(c=>c.name===name))return alert('الفئة موجودة بالفعل.');data.categories.push({name,limit:0});persist()}
function addOwed(){let name=v('oName').trim(),amount=num('oAmount');if(!name||!amount)return alert('أدخل الاسم والمبلغ.');data.debtsOwed.push({name,amount,date:v('oDate'),note:v('oNote')});persist()}
function addRepayment(){let name=v('rName').trim(),amount=num('rAmount');if(!name||!amount)return alert('أدخل الاسم والمبلغ.');data.repayments.push({name,amount,date:v('rDate')});persist()}
function addDebtMe(){let name=v('mName').trim(),amount=num('mAmount');if(!name||!amount)return alert('أدخل الاسم والمبلغ.');data.debtsMe.push({name,amount,paid:num('mPaid'),due:v('mDue'),note:v('mNote')});persist()}
function addFixed(){if(!v('fName').trim()||!num('fAmount'))return alert('أدخل اسم المصروف والمبلغ.');data.fixed.push({name:v('fName'),category:v('fCat'),amount:num('fAmount'),dueDay:num('fDay'),paid:false});persist()}
function toggleFixed(i){data.fixed[i].paid=!data.fixed[i].paid;persist()}
function addOther(){if(!v('xType').trim()||!num('xAmount'))return alert('أدخل النوع والمبلغ.');data.other.push({date:v('xDate'),type:v('xType'),amount:num('xAmount'),note:v('xNote')});persist()}
function addBusiness(){if(!num('wIncome')&&!num('wCost'))return alert('أدخل الدخل أو التكلفة.');data.business.push({date:v('wDate'),income:num('wIncome'),cost:num('wCost'),note:v('wNote')});persist()}
function saveSavingsGoal(){data.config.savingsGoal=num('sGoal');data.config.savingsMonthly=num('sMonthly');persist()}
function addSaving(){if(!num('sAmount'))return alert('أدخل مبلغ الادخار.');data.savings.push({date:v('sDate'),amount:num('sAmount'),note:v('sNote')});persist()}
function removeItem(k,i){if(confirm('هل تريد حذف هذا السجل؟')){data[k].splice(i,1);persist()}}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Ali_Abouraya_Budget_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportExcel(){if(!window.XLSX)return alert('تصدير Excel يحتاج اتصالاً بالإنترنت لتحميل المكتبة.');let wb=XLSX.utils.book_new();let sheets=[['المصاريف',data.entries],['الدخل اليومي',data.dailyIncome],['الميزانية',data.categories],['ديون لك',data.debtsOwed],['السداد',data.repayments],['ديون عليك',data.debtsMe],['الثوابت',data.fixed],['تفصيل أخرى',data.other],['العمل الخاص',data.business],['الادخار',data.savings]];sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,'Ali_Abouraya_Budget_Export.xlsx')}
function excelDate(x){if(typeof x==='number'){let d=XLSX.SSF.parse_date_code(x);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}let d=new Date(x);if(!isNaN(d))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return String(x).slice(0,10)}
function importFile(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{try{if(f.name.toLowerCase().endsWith('.json')){let imported=migrate(JSON.parse(ev.target.result));if(confirm('استبدال بيانات التطبيق الحالية بالنسخة الاحتياطية؟ اضغط إلغاء للاحتفاظ بالبيانات الحالية.'))data=imported;else return;}else{if(!window.XLSX)throw Error('قارئ Excel يحتاج اتصالاً بالإنترنت.');let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});let next=clone(data);let daily=wb.Sheets['اليومي'];if(daily){let arr=XLSX.utils.sheet_to_json(daily,{header:1,defval:''});let heads=arr[3]||[];let catHeads=heads.slice(2,9);for(let row of arr.slice(4)){let date=row[0];if(!date)continue;let ds=excelDate(date);catHeads.forEach((c,i)=>{let amount=+row[i+2]||0;if(c&&amount)next.entries.push({date:ds,category:String(c),amount,note:'مستورد من Excel'})});let extra=+row[9]||0;if(extra)next.dailyIncome.push({date:ds,amount:extra,category:'دخل العمل الثاني',note:'مستورد من Excel'})}}
let budget=wb.Sheets['الميزانية'];if(budget){let a=XLSX.utils.sheet_to_json(budget,{header:1,defval:''});next.config.salary=+a[2]?.[1]||next.config.salary;next.config.extraIncome=+a[2]?.[4]||next.config.extraIncome;let dt=a[3]?.[1];if(dt)next.config.month=excelDate(dt).slice(0,7);let cats=[];for(let r of a.slice(5,13))if(r[0])cats.push({name:String(r[0]),limit:+r[1]||0});if(cats.length)next.categories=cats}
if(wb.Sheets['ديون']){let a=XLSX.utils.sheet_to_json(wb.Sheets['ديون'],{header:1,defval:''});next.debtsOwed=[];for(let r of a.slice(6))if(r[1]&&+r[2])next.debtsOwed.push({date:r[0]?excelDate(r[0]):'',name:String(r[1]),amount:+r[2],note:r[3]||''});next.repayments=[];for(let r of a.slice(6))if(r[6]&&+r[7])next.repayments.push({date:r[5]?excelDate(r[5]):'',name:String(r[6]),amount:+r[7]})}
if(wb.Sheets['ديوني']){let a=XLSX.utils.sheet_to_json(wb.Sheets['ديوني'],{header:1,defval:''});next.debtsMe=[];for(let r of a.slice(7))if(r[0]&&+r[1])next.debtsMe.push({name:String(r[0]),amount:+r[1],paid:+r[2]||0,due:r[4]?excelDate(r[4]):'',note:r[6]||''})}
if(wb.Sheets['الثوابت']){let a=XLSX.utils.sheet_to_json(wb.Sheets['الثوابت'],{header:1,defval:''});next.fixed=[];for(let r of a.slice(7))if(r[0]&&+r[2])next.fixed.push({name:String(r[0]),category:r[1]||'',amount:+r[2],dueDay:+r[3]||0,paid:String(r[4]).trim()==='نعم'})}
if(wb.Sheets['عملي الخاص']){let a=XLSX.utils.sheet_to_json(wb.Sheets['عملي الخاص'],{header:1,defval:''});next.business=[];for(let r of a.slice(7))if(r[0]&&(+r[1]||+r[2]))next.business.push({date:excelDate(r[0]),income:+r[1]||0,cost:+r[2]||0,note:r[4]||''})}
if(wb.Sheets['الادخار']){let a=XLSX.utils.sheet_to_json(wb.Sheets['الادخار'],{header:1,defval:''});next.config.savingsGoal=+a[2]?.[1]||next.config.savingsGoal;next.config.savingsMonthly=+a[3]?.[1]||next.config.savingsMonthly;next.savings=[];for(let r of a.slice(12))if(r[0]&&+r[1])next.savings.push({date:excelDate(r[0]),amount:+r[1],note:r[2]||''})}
if(wb.Sheets['تفصيل أخرى']){let a=XLSX.utils.sheet_to_json(wb.Sheets['تفصيل أخرى'],{header:1,defval:''});next.other=[];for(let r of a.slice(5))if(r[0]&&r[1]&&+r[2])next.other.push({date:excelDate(r[0]),type:String(r[1]),amount:+r[2],note:r[3]||''})}
if(!daily&&!budget)throw Error('لم أجد ورقتي «اليومي» أو «الميزانية» في ملف Excel.');if(!confirm('سيتم استبدال السجلات المستوردة من الملف الحالي ببيانات Excel المحدد. أنشئ نسخة احتياطية أولاً. هل تريد المتابعة؟'))return;data=next;}persist();alert('تم الاستيراد بنجاح. راجع الأقسام والأرقام قبل الاعتماد عليها.')}catch(err){alert('تعذر الاستيراد: '+err.message)}finally{e.target.value=''}};if(f.name.toLowerCase().endsWith('.json'))rd.readAsText(f,'utf-8');else rd.readAsArrayBuffer(f)}
function render(){nav();document.getElementById('pageTitle').textContent=pgs.find(x=>x[0]===page)?.[2]||'';document.getElementById('today').textContent='الشهر المتابَع: '+data.config.month+' · العملة: FCFA';let fn={dashboard,entry,budget,debts,fixed,other,business,savings,weekly,months,alerts,backup:backupPage};document.getElementById('view').innerHTML=fn[page]();let s=document.getElementById('savedAt');if(s)s.textContent=localStorage.getItem('aliBudgetSavedAt')||'لم يتم الحفظ بعد'}
load().then(()=>{render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script></body></html>
